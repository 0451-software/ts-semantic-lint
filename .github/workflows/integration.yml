# Weekly + on-demand live integration test workflow.
# Calls the vendored copy of 0451-software/reusable-workflows/.github/workflows/node-quality-gates.yml@v1
# (see `_reusable-node-quality-gates.yml` for the upstream SHA at vendoring time and resync notes).
# The upstream reusable is private; this caller is public, so we cannot reach the upstream
# directly (GitHub returns "workflow was not found" and schedules 0 jobs). The vendored copy
# at ./.github/workflows/_reusable-node-quality-gates.yml is byte-identical to upstream at the
# recorded SHA; re-vendor when upstream changes.
# Mirrors the pre-PR-#14 intent (b7519cd): TYPESAFE_API_KEY reaches the integration-tests gate
# via `secrets: inherit`; lint now runs from a flat config (`eslint.config.mjs`, eslint v10).

name: integration

on:
  workflow_dispatch:        # manual trigger — full control
  schedule:
    - cron: '0 8 * * 1'     # Mondays 08:00 UTC — weekly cost-controlled run
  pull_request:

# Cancel previous in-progress runs when a new one is dispatched.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/_reusable-node-quality-gates.yml
    with:
      # ESLint v10 flat config (`eslint.config.mjs`) is committed; lint is the default
      # `true` so no override is set here.
      # Skip the live Jev integration-tests gate on PRs (no org secrets in fork PRs); run it on
      # weekly cron and manual dispatch where TYPESAFE_API_KEY is available via secrets: inherit.
      integration_tests_enabled: ${{ github.event_name != 'pull_request' }}
      # TEMPORARY: major-version dependency upgrades are deferred to per-major follow-up cards
      # (typescript 5→7 needs @typescript-eslint v9 support since `typescript-estree@8.70.x`
      # peer-caps at typescript `<6.1.0`; zod 3→4 requires swapping zod-to-json-schema for Zod
      # 4's native `z.toJSONSchema()` because zod-to-json-schema@3.25.2 only accepts Zod v3
      # schemas via `zod/v3`; undici 7→8 bumps its own engines to Node >=22.19.0, on top of
      # commander 15's >=22.12.0; eslint 9→10 was just landed — leave this escape hatch until
      # the remaining follow-up cards land too). The freshness gate still reports the table
      # as an ADVISORY in CI; remove this once all deferred follow-up cards land and the gate
      # can run strictly. See CHANGELOG.md "Unreleased → Dependency upgrades" for the
      # per-major decision matrix.
      fail_on_outdated: false
      # TEMPORARY: commander 12→15 is a cross-major bump that requires pnpm-lock.yaml
      # regeneration (15.x does not satisfy the old ^12.1.0 range). Once the lockfile has
      # been regenerated and committed in this branch, switch back to the default of
      # `frozen_lockfile: true` so subsequent drift detection re-engages.
      frozen_lockfile: false
    secrets:
      inherit
