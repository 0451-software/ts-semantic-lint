# Weekly + on-demand live integration test workflow.
# Calls the vendored copy of 0451-software/reusable-workflows/.github/workflows/node-quality-gates.yml@v1
# (see `_reusable-node-quality-gates.yml` for the upstream SHA at vendoring time and resync notes).
# The upstream reusable is private; this caller is public, so we cannot reach the upstream
# directly (GitHub returns "workflow was not found" and schedules 0 jobs). The vendored copy
# at ./.github/workflows/_reusable-node-quality-gates.yml is byte-identical to upstream at the
# recorded SHA; re-vendor when upstream changes.
# Mirrors the pre-PR-#14 intent (b7519cd): TYPESAFE_API_KEY reaches the integration-tests gate
# via `secrets: inherit`. Lint now runs against the ESLint v10 flat config in `eslint.config.mjs`.

name: integration

on:
  workflow_dispatch: # manual trigger — full control
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC — weekly cost-controlled run
  pull_request:

# Cancel previous in-progress runs when a new one is dispatched.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/_reusable-node-quality-gates.yml
    with:
      # ESLint v10 flat config (`eslint.config.mjs`) is committed; lint is the default
      # `true` so no override is set here.
      # Skip the live Jev integration-tests gate on PRs (no org secrets in fork PRs); run it on
      # weekly cron and manual dispatch where TYPESAFE_API_KEY is available via secrets: inherit.
      integration_tests_enabled: ${{ github.event_name != 'pull_request' }}
      # TEMPORARY: `pnpm outdated --format json` is non-empty until the remaining
      # deferred major-version dependency upgrades land. Two entries as of this commit:
      #   - typescript ^5.9.3 -> ^7.0.2: blocked by `@typescript-eslint/typescript-estree@8.70.1`
      #     peer dep `typescript: ">=4.8.4 <6.1.0"`. Needs `@typescript-eslint` v9 or a
      #     typescript-native parser rewrite of the analyzer.
      #   - @types/node ^22.20.3 -> ^26.6.2: typescript-eslint still types against
      #     the Node 22.x line; bumping to 26 is a separate, low-risk follow-up.
      # The freshness gate still RUNS and reports the table as an advisory. Remove this
      # override once both entries above have landed and the table is empty. See
      # CHANGELOG.md "Deferred to a follow-up card" for the per-major decision matrix.
      fail_on_outdated: false
      # The unit-test gate runs `pnpm run test` (default), which is `vitest run` and picks up
      # EVERY test file — including tests/integration/live.test.ts. That file's `beforeAll`
      # throws `CLI not built. Run npm run build first (looked for dist/cli.js)` because
      # `vitest run` and the `build` job run on separate runners with separate checkouts;
      # even with `needs: [build]`, the artifact is not handed across jobs. The reusable-workflows
      # structural fix for this gap (build uploads `dist/`, unit-tests downloads it) is tracked
      # separately as upstream PR #45 / kanban t_8e0a7b6c / t_55373397. Until that lands in
      # the vendored copy, exclude the integration suite from the unit-test gate here so PR CI
      # goes green; the live suite still runs via the integration-tests gate on cron + dispatch.
      #
      # `test:unit` is a new package.json script that wraps
      # `vitest run --exclude '**/integration/**'`. The reusable workflow runs scripts via
      # `pnpm run <GATE_SCRIPT>` after probing package.json for the script name, so we point
      # at the script rather than at a literal command — passing a multi-word command here
      # would either fail the probe and silently skip the gate (worse than failing) or be
      # forwarded to `pnpm run`, which would treat `vitest` as the script name and miss it.
      unit_test_script: "test:unit"
      # Same intent on the integration-tests gate: scope it to tests/integration so it never
      # double-runs the unit suite. Matches the package.json script `test:integration` verbatim.
      integration_test_script: "test:integration"
    secrets: inherit
