# Diagnostic: just the reusable call, no `secrets:` block.

name: integration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
  pull_request:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    uses: 0451-software/reusable-workflows/.github/workflows/node-quality-gates.yml@v1
    with:
      working_directory: '.'
      node_version: '20'
      lint_enabled: false
      integration_tests_enabled: ${{ github.event_name != 'pull_request' }}